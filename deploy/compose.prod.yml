# Bolo on the shared elioo EC2 box (see docs/RUNBOOK.md). Run with:
#   IMAGE_TAG=<sha> docker-compose --env-file bolo.env -p bolo -f compose.yml up -d
# Hard memory caps and rotated logs protect the other tenants on a 3.8 GB box with no swap and a shared disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  bolo-db:
    image: postgres:17-alpine
    container_name: bolo-db
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolo
      POSTGRES_USER: bolo
      POSTGRES_PASSWORD: ${BOLO_DB_PASSWORD:?set BOLO_DB_PASSWORD in bolo.env}
    volumes:
      - bolo_pgdata:/var/lib/postgresql/data
    networks: [bolo_internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolo -d bolo"]
      interval: 5s
      retries: 20

  bolo-api:
    image: bolo-api:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: bolo-api
    logging: *logging
    cpus: 1.0
    restart: unless-stopped
    env_file: bolo.env
    environment:
      BOLO_DB_URL: jdbc:postgresql://bolo-db:5432/bolo
      BOLO_DB_USER: bolo
      # Real vendors in production; the app's defaults are fakes so tests and keyless dev never call them.
      BOLO_SPEECH_VENDOR: azure
      # Google sign-in: the four BOLO_FIREBASE_* values (public) live in bolo.env; without them sign-in stays off.
      BOLO_AUTH_VENDOR: firebase
      # Open sign-up (P1d): no invite needed; a guest signs in with Google before the first talk.
      # Set "true" to go back to a closed beta (invite links, scripts/invite.sh). This file beats bolo.env.
      BOLO_INVITES_REQUIRED: "false"
      # Azure Speech S0 (2026-11-09): several live talks at once. Raise with care: bolo-api has 512 MB.
      BOLO_TALK_MAX_LIVE: "4"
      BOLO_LLM_VENDOR: anthropic
      # Learner audio, AES-256-GCM encrypted with BOLO_MEDIA_KEY (bolo.env); deleted by the retention sweep (NFR-14).
      BOLO_MEDIA_DIR: /data/media
    volumes:
      - bolo_media:/data/media
    depends_on:
      bolo-db:
        condition: service_healthy
    networks: [bolo_internal, n8n_edge]
    mem_limit: 512m

  bolo-web:
    image: bolo-web:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: bolo-web
    logging: *logging
    restart: unless-stopped
    networks: [n8n_edge]
    mem_limit: 256m

volumes:
  bolo_pgdata:
  bolo_media:

networks:
  bolo_internal:
    internal: true
  n8n_edge:
    external: true
