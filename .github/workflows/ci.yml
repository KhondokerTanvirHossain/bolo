name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - name: Build and test (unit, ArchUnit, Testcontainers Postgres)
        run: ./gradlew build --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: api-test-reports, path: api/build/reports/tests }

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npx playwright install --with-deps chromium firefox
      - name: End-to-end (Chromium fake mic + Firefox fake stream)
        run: pnpm e2e
        env: { CI: "1" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report }
