# Tests use the fake identity vendor ("fake:<uid>:<email>"); production verifies real Google tokens (the default).
bolo.auth.vendor=fake
bolo.guests.may-talk=true
# Daily reminders: the minute job is off in tests; they call ReminderSendService.sendDue directly.
bolo.reminder.job-ms=86400000
bolo.push.hosts=fcm.googleapis.com,updates.push.services.mozilla.com,.push.apple.com,.notify.windows.com,push.example
