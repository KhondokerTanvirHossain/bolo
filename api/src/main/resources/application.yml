spring:
  application.name: bolo-api
  threads.virtual.enabled: true
  datasource:
    url: ${BOLO_DB_URL:jdbc:postgresql://localhost:5434/bolo}
    username: ${BOLO_DB_USER:bolo}
    password: ${BOLO_DB_PASSWORD:bolo}
    hikari:
      # Every table lives in the bolo schema; set it per connection so it holds for any URL (Testcontainers too).
      connection-init-sql: set search_path to bolo
      maximum-pool-size: 10
  flyway:
    schemas: bolo
    default-schema: bolo
    create-schemas: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints.web:
    base-path: /api/actuator
    exposure.include: health
  endpoint.health.probes.enabled: false

bolo:
  # The browser origin allowed to write to /api (WriteGuardFilter). Production sets BOLO_PUBLIC_ORIGIN.
  public-origin: ${BOLO_PUBLIC_ORIGIN:http://localhost:3000}
  # Consent policy in force (NFR-16). A new version means every learner is asked again.
  policy-version: 2026-11-v1
  # Session cookie Secure flag; off only for plain-http local development.
  secure-cookie: ${BOLO_SECURE_COOKIE:true}
  # New guests per client IP per hour (generous: carrier and campus NAT put many learners on one IP), and in total
  # per hour (bounds disk growth on the shared box whatever the addresses).
  guests-per-ip-per-hour: ${BOLO_GUESTS_PER_IP_PER_HOUR:300}
  guests-per-hour: ${BOLO_GUESTS_PER_HOUR:3000}
  talk:
    # Live talks at once. Azure Speech's free tier allows one live recognition, so 1 until we move to S0.
    max-live-sessions: ${BOLO_TALK_MAX_LIVE:1}
    # TLK-4: start a speculative reply after this much silence, end the turn after end-after-ms, or after
    # unfinished-end-after-ms when the last word suggests more is coming.
    speculate-after-ms: 1000
    end-after-ms: 2500
    unfinished-end-after-ms: 4000
    unfinished-words: and,but,because,so,or,then,like,um,uh,the,a,an,to,my,i
    # One minute of talk time; tests shorten it.
    minute-ms: 60000
    # TLK-9: a learner still talking this long after the talk time gets Bolo's goodbye anyway.
    wrap-grace-ms: 60000
    # A reply that hasn't finished streaming in this long ends the talk kindly.
    reply-timeout-ms: 20000
    # A socket that sends no audio for this long (a half-open phone connection) is ended.
    no-audio-timeout-ms: 15000
    # Audio may run this far ahead of real time (x1.2) before frames are dropped: the recogniser is billed per second.
    burst-allowance-ms: 3000
    # A created talk nobody connects to within this long stops holding the slot.
    attach-within-ms: 15000
  speech:
    # azure | fake. Production sets azure in deploy/compose.prod.yml; fake keeps tests and keyless dev working.
    vendor: ${BOLO_SPEECH_VENDOR:fake}
    azure:
      key: ${BOLO_AZURE_SPEECH_KEY:}
      region: ${BOLO_AZURE_SPEECH_REGION:centralindia}
      # en-US: Azure's pronunciation assessment names the sounds (IPA) only for en-US; en-IN returns empty symbols.
      stt-language: en-US
      buddy-voice: en-IN-NeerjaNeural
      buddy-rate: "-5%"
      # The Coach is a separate character with its own voice (PRD §4).
      coach-voice: en-US-AndrewNeural
  media:
    # Encrypted learner audio (AES-256-GCM). Production mounts a volume here and sets BOLO_MEDIA_KEY.
    dir: ${BOLO_MEDIA_DIR:${java.io.tmpdir}/bolo-media}
    key: ${BOLO_MEDIA_KEY:}
  llm:
    # anthropic | fake. Production sets anthropic in deploy/compose.prod.yml.
    vendor: ${BOLO_LLM_VENDOR:fake}
    anthropic:
      key: ${BOLO_ANTHROPIC_API_KEY:}
    buddy-model: claude-haiku-5-5
    max-tokens: 300
  coaching:
    model: claude-sonnet-5-5
    max-tokens: 1500
    # ASM-6: under this much learner speech, no debrief ("not enough talking"). Tests shorten it.
    min-speech-ms: 60000
    retry-backoff-ms: 2000

logging.level.root: INFO
