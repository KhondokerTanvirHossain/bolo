plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.bolo'
version = '0.0.1'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.53.0@jar'
    implementation 'com.anthropic:anthropic-java:3.6.0'
    // Verifies Firebase ID tokens (Google sign-in) against Google's public keys; no service account.
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'live' }
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// Probes the deployed Bolo with real vendors: BOLO_LIVE_URL=https://bolo.eliooo.org ./gradlew liveProbe
tasks.register('liveProbe', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    testLogging { events 'passed', 'failed'; exceptionFormat 'full'; showStandardStreams = true }
    outputs.upToDateWhen { false }
}

// Gate 1 accuracy harness (a developer tool on the test classpath, not shipped):
// ./gradlew goldenSet -Pset=<dir> [-Pmode=offline|refresh]   — see scripts/golden-set.sh and docs/RUNBOOK.md
tasks.register('goldenSet', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'app.bolo.goldenset.GoldenSetRunner'
    args = [project.findProperty('set') ?: '', *(project.findProperty('mode') ? ["--${project.property('mode')}"] : [])]
    ignoreExitValue = false
}

// For scripts/golden-set.sh: the Java 21 launcher and the classpath, so the script runs the harness itself and its
// exit code (0 / 1 gate failed / 2 error) comes through (Gradle turns every non-zero exit into 1).
tasks.register('goldenSetCommand') {
    dependsOn 'testClasses'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def cp = sourceSets.test.runtimeClasspath
    doLast {
        println launcher.get().executablePath.asFile.absolutePath
        println cp.asPath
    }
}

tasks.named('bootJar') { archiveFileName = 'bolo-api.jar' }
tasks.named('jar') { enabled = false }
