<!-- @dsCard group="Screens" height=820 subtitle="Choose what Bolo keeps, before it listens" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenConsent — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <div style="height:var(--space-8)"></div>
    <div class="bo-hero-icon bo-hero-icon--coach" style="align-self:flex-start"><span class="bo-icon" aria-hidden="true">shield_person</span></div>
    <h1 class="bo-flow__title" style="margin-top:var(--space-5)">Bolo listens only while you practise.</h1>
    <p class="bo-flow__body">Keep your recordings so you can hear your progress later?</p>
    <p class="bo-flow__bn">রেকর্ডিং রেখে দেবেন, যাতে পরে নিজের উন্নতি শুনতে পারেন?</p>
    <div style="flex:1"></div>
    <label class="bo-check bo-check--on"><span class="bo-check__box"><span class="bo-icon bo-icon--sm" aria-hidden="true">check</span></span>I'm 13 or older</label>
    <div class="bo-flow__actions" style="margin-top:var(--space-3);gap:var(--space-2)">
      <button class="bo-btn bo-btn--secondary bo-btn--block">Yes, keep them</button>
      <button class="bo-btn bo-btn--secondary bo-btn--block">No, just give feedback</button>
      <button class="bo-btn bo-btn--quiet-neutral">I'm under 13</button>
    </div>
  </div>
</div>
</div>
</body>
</html>
