<!-- @dsCard group="Screens" height=820 subtitle="Settings → Bolo's voice: female or male, British, American or Indian; hear before choosing" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenVoicePicker — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div style="flex:1;min-height:0;overflow:hidden;padding:0 var(--space-5) var(--space-6);display:flex;flex-direction:column">
    <div class="bo-flow__top"><button class="bo-back"><span class="bo-icon" aria-hidden="true">arrow_back</span>Settings</button></div>
    <h1 class="large-title" style="margin:var(--space-2) 0 var(--space-3)">Bolo's voice</h1>
    <p class="bo-memnote">Pick who Bolo sounds like. You'll hear it from your next talk.</p>
    <div class="bo-chips" role="radiogroup" aria-label="Voice" style="margin-bottom:var(--space-5)"><button class="bo-chip" role="radio" aria-checked="true" aria-pressed="true">Female</button><button class="bo-chip" role="radio" aria-checked="false" aria-pressed="false">Male</button></div>
    <div class="bo-group__title" style="padding-left:0">English</div>
    <div class="bo-group" role="radiogroup" aria-label="Accent"><div class="bo-voice"><button class="bo-voice__pick" role="radio" aria-checked="true"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">British</span><span class="bo-row__sub">English from the UK</span></span></button><button class="bo-voice__hear" aria-pressed="false" aria-label="Hear the British female voice"><span class="bo-icon bo-icon--sm" aria-hidden="true">play_arrow</span>Hear it</button></div><div class="bo-voice"><button class="bo-voice__pick" role="radio" aria-checked="false"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">American</span><span class="bo-row__sub">English from the US</span></span></button><button class="bo-voice__hear" aria-pressed="true" aria-label="Hear the American female voice"><span class="bo-icon bo-icon--sm" aria-hidden="true">graphic_eq</span>Playing</button></div><div class="bo-voice"><button class="bo-voice__pick" role="radio" aria-checked="false"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">Indian</span><span class="bo-row__sub">English from India</span></span></button><button class="bo-voice__hear" aria-pressed="false" aria-label="Hear the Indian female voice"><span class="bo-icon bo-icon--sm" aria-hidden="true">play_arrow</span>Hear it</button></div></div>
    <div style="flex:1"></div>
    <p class="bo-footnote">Your Coach keeps its own voice. How Bolo understands you doesn't change.</p>
  </div>
</div>
</div>
</body>
</html>
