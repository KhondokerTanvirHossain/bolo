<!-- @dsCard group="Screens" height=900 subtitle="Settings → Time to answer: Automatic, Quick, Normal or Relaxed — how long Bolo waits for you" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenAnswerTime — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone" style="height:860px">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div style="flex:1;min-height:0;overflow:hidden;padding:0 var(--space-5) var(--space-6);display:flex;flex-direction:column">
    <div class="bo-flow__top"><button class="bo-back"><span class="bo-icon" aria-hidden="true">arrow_back</span>Settings</button></div>
    <h1 class="large-title" style="margin:var(--space-2) 0 var(--space-3)">Time to answer</h1>
    <p class="bo-memnote">How long Bolo waits for you to start, and how soon it replies when you stop. From your next talk.</p>
    <div class="bo-group" role="radiogroup" aria-label="Time to answer"><button class="bo-mood" role="radio" aria-checked="true"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">Automatic</span><span class="bo-row__sub" style="display:block">Bolo learns how long you take to start answering and matches it. Right now: Relaxed</span></span></button><button class="bo-mood" role="radio" aria-checked="false"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">Quick</span><span class="bo-row__sub" style="display:block">Bolo replies as soon as you stop. Help comes after 5 seconds of silence</span></span></button><button class="bo-mood" role="radio" aria-checked="false"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">Normal</span><span class="bo-row__sub" style="display:block">A short wait after you stop. Help comes after 8 seconds</span></span></button><button class="bo-mood" role="radio" aria-checked="false"><span class="bo-radio"></span><span class="bo-row__body"><span class="bo-row__title" style="display:block">Relaxed</span><span class="bo-row__sub" style="display:block">Plenty of time to think. Help comes after 30 seconds</span></span></button></div>
    <p class="bo-memnote" style="margin-top:var(--space-4)">Bolo always helps if you stay quiet, and pauses the talk if you stay quiet for long.</p>
  </div>
</div>
</div>
</body>
</html>
