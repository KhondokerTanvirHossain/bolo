<!-- @dsCard group="Screens" height=820 subtitle="Auto-read where Android allows it" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenPhoneCode — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:52</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow" style="padding-bottom:var(--space-4)">
    <div class="bo-flow__top"><button class="bo-back" aria-label="Back"><span class="bo-icon" aria-hidden="true">arrow_back</span></button></div>
    <h1 class="bo-flow__title" style="margin-top:var(--space-2)">Enter the code</h1>
    <p class="bo-flow__body">Sent to +880 1712 345 678. <a class="bo-link" href="#">Change</a></p>
    <div style="height:var(--space-6)"></div>
    <div class="bo-code" role="group" aria-label="6-digit code"><span class="bo-code__cell bo-code__cell--filled">4</span><span class="bo-code__cell bo-code__cell--filled">8</span><span class="bo-code__cell bo-code__cell--filled">1</span><span class="bo-code__cell bo-code__cell--next"></span><span class="bo-code__cell"></span><span class="bo-code__cell"></span></div>
    <p class="bo-code__note"><span class="bo-icon bo-icon--sm" aria-hidden="true">sms</span>Reading the code from your messages…</p>
    <div style="flex:1"></div>
    <div class="bo-flow__actions">
      <button class="bo-btn bo-btn--quiet-neutral" disabled style="background:transparent">Resend code in 0:18</button>
    </div>
  </div>
<div class="bo-keypad" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span class="fn"></span><span>0</span><span class="fn"><span class="bo-icon" aria-hidden="true">backspace</span></span></div>
</div>
</div>
</body>
</html>
