<!-- @dsCard group="Screens" height=820 subtitle="One field, +880 already filled" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenPhoneNumber — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:52</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow" style="padding-bottom:var(--space-4)">
    <div class="bo-flow__top"><button class="bo-back" aria-label="Back"><span class="bo-icon" aria-hidden="true">arrow_back</span></button></div>
    <h1 class="bo-flow__title" style="margin-top:var(--space-2)">Your phone number</h1>
    <p class="bo-flow__body">We'll text you a 6-digit code.</p>
    <p class="bo-flow__bn">আমরা আপনাকে ৬ সংখ্যার একটি কোড পাঠাব।</p>
    <div style="height:var(--space-6)"></div>
    <p class="bo-field__label">Mobile number</p>
    <div class="bo-field bo-field--focus"><span class="bo-field__prefix">+880</span><span>1712 345 678</span><span class="bo-field__caret"></span></div>
    <div style="flex:1"></div>
    <div class="bo-flow__actions">
      <p class="bo-footnote">We use your number only to sign you in.</p>
      <button class="bo-btn bo-btn--primary bo-btn--block">Send code</button>
    </div>
  </div>
<div class="bo-keypad" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span class="fn"></span><span>0</span><span class="fn"><span class="bo-icon" aria-hidden="true">backspace</span></span></div>
</div>
</div>
</body>
</html>
