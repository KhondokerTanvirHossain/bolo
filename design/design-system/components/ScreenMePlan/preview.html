<!-- @dsCard group="Screens" height=820 subtitle="What you pay, what you have used, how to leave" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenMePlan — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <div class="bo-flow__top"><button class="bo-back"><span class="bo-icon" aria-hidden="true">arrow_back</span>Me</button></div>
    <h1 class="large-title" style="margin:var(--space-2) 0 var(--space-5)">Your plan</h1>
    <div class="bo-card">
      <p class="bo-planhead">Premium</p>
      <p class="bo-planprice">৳500 <small>a month</small></p>
      <p class="bo-row__sub" style="margin:var(--space-1) 0 var(--space-5);font-size:14px">Renews on 6 December · bKash</p>
      <div class="bo-usage"><div class="bo-usage__label"><span>Talks this month</span><span>12 of 50</span></div><div class="bo-usage__track"><div class="bo-usage__fill" style="width:24%"></div></div></div>
    </div>
    <div style="height:var(--space-6)"></div>
    <div class="bo-group">
      <div class="bo-row"><div class="bo-row__body"><div class="bo-row__title">Change plan</div></div><span class="bo-icon bo-chev" aria-hidden="true">chevron_right</span></div>
      <div class="bo-row"><div class="bo-row__body"><div class="bo-row__title">Payment method</div></div><span class="bo-row__value">bKash</span><span class="bo-icon bo-chev" aria-hidden="true">chevron_right</span></div>
      <div class="bo-row"><div class="bo-row__body"><div class="bo-row__title">Payments</div></div><span class="bo-icon bo-chev" aria-hidden="true">chevron_right</span></div>
    </div>
    <div style="flex:1"></div>
    <button class="bo-btn bo-btn--quiet-neutral" style="align-self:center">Cancel plan</button>
  </div>
</div>
</div>
</body>
</html>
