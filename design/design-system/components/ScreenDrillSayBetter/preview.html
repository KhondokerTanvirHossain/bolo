<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenDrillSayBetter — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <div class="bo-drillbar"><button class="bo-btn bo-btn--quiet-neutral" aria-label="Close drills"><span class="bo-icon" aria-hidden="true">close</span></button><div class="bo-dots" aria-label="Step 3 of 3"><i></i><i></i><i class="on"></i></div><button class="bo-btn bo-btn--quiet-neutral">Skip</button></div><div class="bo-eyebrow bo-eyebrow--coach" style="margin-top:var(--space-2)"><span class="bo-coach-mark">C</span>Say it better · Round 2 of 3</div>

    <div style="height:var(--space-5)"></div>
    <p class="bo-fix__label">Now say</p>
    <p class="bo-fix__sentence" style="margin:0;font-size:22px;line-height:34px;font-weight:600">"Yesterday I <span class="bo-blank"></span> bug in the payment service <span style="white-space:nowrap"><span class="bo-blank" style="min-width:120px"></span>."</span></p>

      <p class="bo-footnote">Listening… say the whole sentence</p>
    </div>
  </div>
</div>
</div>
