<!-- @dsCard group="Coach" height=620 subtitle="The standup fix: You said → Try → why → Try it" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StandupTip — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--col">
  <article class="bo-fix" aria-label="Fix 2 of 3: Give a date, not soon">
    <div class="bo-fix__head"><div class="bo-dots" aria-label="2 of 3"><i></i><i class="on"></i><i></i></div><span class="bo-eyebrow bo-eyebrow--coach">Standup tip</span></div>
    <h2 class="bo-fix__title">Give a date, not "soon"</h2>
    <div><p class="bo-fix__label">You said</p><p class="bo-fix__sentence bo-fix__sentence--before" style="margin:0">"The refund report will be ready soon, I think."</p></div>
    <div><p class="bo-fix__label">Try</p><div class="bo-clip bo-clip--model"><button class="bo-clip__play" aria-label="Play the better version"><span class="bo-icon bo-icon--fill" aria-hidden="true">play_arrow</span></button><div class="bo-clip__wave" aria-hidden="true"><i style="height:4px"></i><i style="height:8px"></i><i style="height:10px"></i><i style="height:10px"></i><i style="height:8px"></i><i style="height:18px"></i><i style="height:19px"></i><i style="height:15px"></i><i style="height:16px"></i><i style="height:11px"></i><i style="height:7px"></i><i style="height:15px"></i><i style="height:19px"></i><i style="height:8px"></i><i style="height:23px"></i><i style="height:12px"></i><i style="height:11px"></i><i style="height:7px"></i><i style="height:24px"></i><i style="height:18px"></i><i style="height:19px"></i><i style="height:13px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:6px"></i><i style="height:4px"></i></div><span class="bo-clip__time">0:03</span><button class="bo-clip__tool" aria-label="Play slower"><span class="bo-icon bo-icon--sm" aria-hidden="true">slow_motion_video</span></button></div><p class="bo-fix__sentence">"The refund report will be ready <span class="bo-better">by Thursday afternoon</span>."</p></div>
    <div class="bo-tip"><span class="bo-icon " aria-hidden="true">event</span><p class="bo-tip__text">A manager plans around your date. "Soon" makes them ask again.</p><button class="bo-tip__bn">বাংলায়</button></div>
    <div class="bo-fix__actions">
      <button class="bo-btn bo-btn--primary bo-btn--block"><span class="bo-icon bo-icon--fill" aria-hidden="true">mic</span>Try it</button>
      <button class="bo-btn bo-btn--quiet-neutral">That's not what I said</button>
    </div>
  </article>
</div>
</body>
</html>
