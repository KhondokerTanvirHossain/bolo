<!-- @dsCard group="Screens" height=820 subtitle="Three questions, answered by voice or a tap" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenSetupQuestion — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <div class="bo-steps"><button class="bo-back" aria-label="Back"><span class="bo-icon" aria-hidden="true">arrow_back</span></button><div class="bo-dots" aria-label="Step 1 of 3"><i class="on"></i><i></i><i></i></div><div class="bo-steps__end"></div></div>
    <div class="bo-eyebrow" style="margin-top:var(--space-4)"><span class="bo-buddy-mark">B</span>Bolo asks</div>
    <h1 class="bo-flow__title" style="margin-top:var(--space-2)">What do you need English for most?</h1>
    <p class="bo-flow__bn" style="margin-top:0">ইংরেজি আপনার সবচেয়ে বেশি কোথায় দরকার?</p>
    <p class="bo-footnote" style="text-align:left;margin:var(--space-5) 0 var(--space-3)">You said "for my office meetings". Or tap one.</p>
    <div class="bo-chips">
      <button class="bo-chip" aria-pressed="true"><span class="bo-icon bo-icon--sm" aria-hidden="true">check</span>Work meetings</button>
      <button class="bo-chip" aria-pressed="false">Job interviews</button>
      <button class="bo-chip" aria-pressed="false">Study abroad</button>
      <button class="bo-chip" aria-pressed="false">Daily confidence</button>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-5)">
      <div class="bo-voiceonly" style="border-radius:var(--radius-full);padding:4px"><div class="bo-mic bo-mic--turn" role="status" aria-label="Listening"><svg class="arc" viewBox="0 0 96 96" aria-hidden="true"><circle class="track" cx="48" cy="48" r="46"/><circle class="left" cx="48" cy="48" r="46" stroke-dasharray="289 289.0"/></svg><div class="bo-mic__core"><span class="bo-icon bo-icon--lg" aria-hidden="true">mic</span></div></div></div>
      <button class="bo-btn bo-btn--primary bo-btn--block">Next</button>
    </div>
  </div>
</div>
</div>
</body>
</html>
