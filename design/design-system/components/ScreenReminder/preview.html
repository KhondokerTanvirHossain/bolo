<!-- @dsCard group="Screens" height=820 subtitle="End of first loop, step 3: one reminder, the learner's time" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenReminder — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:52</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <h1 class="bo-flow__title" style="margin-top:var(--space-3)">When should Bolo check in?</h1>
    <p class="bo-flow__body">One reminder a day, only if you haven't talked yet.</p>
    <p class="bo-flow__bn">দিনে একবার, শুধু যদি সেদিন কথা না বলেন।</p>
    <div style="height:var(--space-5)"></div>
    <div class="bo-notif" aria-label="Example reminder"><span class="bo-notif__app">B</span><div><div class="bo-notif__meta">Bolo · 6:30 pm</div><p class="bo-notif__text">Bolo wants to know how the demo went.</p></div></div>
    <div style="height:var(--space-5)"></div>
    <div class="bo-slots" role="radiogroup" aria-label="Reminder time">
      <button class="bo-slot" role="radio" aria-checked="false"><span class="bo-icon" aria-hidden="true">wb_twilight</span><span class="bo-slot__name">Morning commute</span><span class="bo-slot__time">8:00 am</span></button>
      <button class="bo-slot" role="radio" aria-checked="false"><span class="bo-icon" aria-hidden="true">lunch_dining</span><span class="bo-slot__name">Lunch</span><span class="bo-slot__time">1:30 pm</span></button>
      <button class="bo-slot" role="radio" aria-checked="true"><span class="bo-icon bo-icon--fill" aria-hidden="true">directions_bus</span><span class="bo-slot__name">Evening commute</span><span class="bo-slot__time">6:30 pm</span></button>
      <button class="bo-slot" role="radio" aria-checked="false"><span class="bo-icon" aria-hidden="true">bedtime</span><span class="bo-slot__name">Night</span><span class="bo-slot__time">10:00 pm</span></button>
    </div>
    <div class="bo-exact"><span class="bo-icon" aria-hidden="true">schedule</span>Pick an exact time</div>
    <div style="flex:1"></div>
    <div class="bo-flow__actions" style="gap:var(--space-2)">
      <p class="bo-footnote">Next, Android asks to allow notifications.</p>
      <button class="bo-btn bo-btn--primary bo-btn--block">Remind me at 6:30 pm</button>
      <button class="bo-btn bo-btn--quiet-neutral">Not now</button>
    </div>
  </div>
</div>
</div>
</body>
</html>
