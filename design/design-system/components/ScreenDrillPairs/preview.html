<!-- @dsCard group="Screens" height=820 subtitle="Drill 1: hear the difference, then say it" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenDrillPairs — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:41</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-flow">
    <div class="bo-drillbar"><button class="bo-btn bo-btn--quiet-neutral" aria-label="Close drills"><span class="bo-icon" aria-hidden="true">close</span></button><div class="bo-dots" aria-label="Step 1 of 3"><i class="on"></i><i></i><i></i></div><button class="bo-btn bo-btn--quiet-neutral">Skip</button></div><div class="bo-eyebrow bo-eyebrow--coach" style="margin-top:var(--space-2)"><span class="bo-coach-mark">C</span>The v sound · Hear the difference</div>
    <h1 class="bo-flow__title" style="text-align:center;margin-top:var(--space-8)">Which did you hear?</h1>
    <div style="height:var(--space-6)"></div>
    <button class="bo-hear" aria-label="Hear it again"><span class="bo-icon bo-icon--lg" aria-hidden="true">volume_up</span></button>
    <div style="height:var(--space-8)"></div>
    <div class="bo-pairs"><button class="bo-pair bo-pair--right" aria-label="very, that's it">very<small><span class="bo-icon bo-icon--fill bo-icon--sm" aria-hidden="true">check_circle</span> That's it</small></button><button class="bo-pair bo-pair--other">berry<small>&nbsp;</small></button></div>
    <div style="flex:1"></div>
    <div class="bo-dots" style="align-self:center;margin-bottom:var(--space-2)" aria-label="Listening round 1 of 3"><i class="on"></i><i></i><i></i></div>
    <p class="bo-footnote">Listening round 1 of 3, then you say 5 words</p>
  </div>
</div>
</div>
</body>
</html>
