<!-- @dsCard group="Desktop" height=600 subtitle="One drill card on a quiet page, keys 1 and 2 answer" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DesktopDrill — Bolo</title><style>.dk-fit{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#0b0816}.dk-fit>.dk-root{position:absolute;top:0;left:0;width:1440px;height:900px;transform-origin:top left;transform:scale(.6)}.dk-fit .dk-screen{display:block}.dk-fit .dk-perm{display:none}</style></head>
<body>
<div class="dk-fit"><div class="dk-root"><section class="dk-screen" data-screen="drill"><div class="dk-main" style="padding:28px 48px"><div style="display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto 24px"><button class="bo-btn bo-btn--quiet-neutral" data-go="save" aria-label="Close drills"><span class="bo-icon" aria-hidden="true">close</span></button><div class="bo-dots"><i class="on"></i><i></i><i></i></div><button class="bo-btn bo-btn--quiet-neutral" data-go="drilldone">Skip</button></div><div class="dk-stagecard"><div class="bo-eyebrow bo-eyebrow--coach"><span class="bo-coach-mark">C</span>The v sound · Hear the difference</div><h1 class="bo-flow__title" style="text-align:center;margin-top:24px">Which did you hear?</h1><button class="bo-hear" style="margin:20px auto" aria-label="Hear it again" data-toast="Bolo plays one word"><span class="bo-icon bo-icon--lg" aria-hidden="true">volume_up</span></button><div class="bo-pairs" style="margin-top:12px"><button class="bo-pair" data-act="pair-right">very<small><span class="dk-kbd">1</span></small></button><button class="bo-pair" data-act="pair-other">berry<small><span class="dk-kbd">2</span></small></button></div><p class="bo-footnote" style="margin-top:18px">Listening round 1 of 3, then you say 5 words. Press <span class="dk-kbd">L</span> to listen again.</p></div></div></section></div></div>
<script>(function(){function f(){document.querySelectorAll('.dk-fit').forEach(function(w){w.firstElementChild.style.transform='scale('+(w.clientWidth/1440)+')'})}f();addEventListener('resize',f);new ResizeObserver(f).observe(document.body)})()</script>
</body>
</html>
