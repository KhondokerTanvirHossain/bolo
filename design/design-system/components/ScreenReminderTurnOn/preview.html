<!-- @dsCard group="Screens" height=820 subtitle="Opened from the iPhone Home Screen the first time: turn the saved reminder on" page -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenReminderTurnOn — Bolo</title></head>
<body>
<div class="bo-stage bo-stage--center" style="padding:24px 0">
<div class="bo-phone">
<div class="bo-statusbar"><span>9:52</span><span><span class="bo-icon bo-icon--sm" aria-hidden="true">signal_cellular_alt</span> <span class="bo-icon bo-icon--sm" aria-hidden="true">battery_5_bar</span></span></div>
<div class="bo-sheet-host" style="flex:1;border-radius:0">
  <div style="padding:var(--space-5)">
    <h1 class="large-title" style="margin:var(--space-2) 0 var(--space-3)">Good evening, Rafi</h1>
    <p class="bo-row__sub" style="font-size:15px">Bolo is ready when you are.</p>
  </div>
  <div class="bo-sheet-scrim"></div>
  <div class="bo-sheet" role="dialog" aria-label="Turn on your reminder">
    <div class="bo-sheet__grabber"></div>
    <p class="bo-sheet__title">Turn on your reminder?</p>
    <p class="bo-sheet__body">Bolo checks in at 6:30 pm, only if you haven't talked yet.</p>
    <div class="bo-notif" aria-label="Example reminder" style="margin:var(--space-3) 0"><span class="bo-notif__app">B</span><div><div class="bo-notif__meta">Bolo · 6:30 pm</div><p class="bo-notif__text">Bolo wants to know how the demo went.</p></div></div>
    <p class="bo-footnote">Next, your iPhone asks to allow notifications.</p>
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3)"><button class="bo-btn bo-btn--primary" style="flex:1">Turn on reminders</button><button class="bo-btn bo-btn--quiet-neutral">Not now</button></div>
  </div>
</div>
</div>
</div>
</body>
</html>
