<head><meta charset="utf-8"><title>TalkChat — Bolo</title></head>

="0.5"/><circle class="dust" cx="136" cy="58" r="1.4" opacity="0.85"/><g class="twinkle" style="animation-delay:0s"><circle class="starglow" cx="96" cy="206" r="10.4"/><path class="spark" d="M96 199.5 Q96 206 102.5 206 Q96 206 96 212.5 Q96 206 89.5 206 Q96 206 96 199.5Z"/></g><g class="twinkle" style="animation-delay:1.6s"><circle class="starglow" cx="258" cy="166" r="8.0"/><path class="spark" d="M258 161 Q258 166 263 166 Q258 166 258 171 Q258 166 253 166 Q258 166 258 161Z"/></g><circle class="aura" cx="222" cy="300" r="140"/>
<circle class="sun" cx="222" cy="300" r="54"/>
<path class="far" d="M0 316 C64 290 118 300 168 312 C228 326 286 294 360 302 L360 520 L0 520Z"/>

  <div style="position:relative;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center">
    <span class="bo-timeleft" role="timer" aria-label="3 minutes 42 seconds left"><span class="bo-timeleft__what">Free talk</span>3:42 left</span>
    <span class="bo-timeleft" role="timer">1 minute left</span>
    <span class="bo-timeleft" role="timer">Wrapping up</span>
  </div>
  <div style="position:relative;height:360px">
    <div class="bo-chat" role="log" aria-live="polite" aria-label="Conversation" style="height:100%">
      <div class="bo-chat__turn bo-chat__turn--bolo"><p class="bo-chat__text"><span class="bo-chat__who">Bolo</span>Tell me about a time a plan went wrong at work.</p></div>
      <div class="bo-chat__turn bo-chat__turn--you"><span class="bo-chat__who">You</span><p class="bo-chat__text">Last month our client changed the deadline.</p></div>
      <div class="bo-chat__turn bo-chat__turn--bolo"><p class="bo-chat__text"><span class="bo-chat__who">Bolo</span><span class="w on">Ouch.</span> <span class="w on">What</span> <span class="w on">did</span> <span class="w">you</span> <span class="w">do</span> <span class="w">first?</span></p><button class="bo-caption__replay" aria-label="Repeat that"><span class="bo-icon bo-icon--sm" aria-hidden="true">replay</span></button></div>
      <div class="bo-chat__turn bo-chat__turn--you bo-chat__turn--live"><span class="bo-chat__who">You · speaking</span><p class="bo-chat__text">First I called my team and we</p></div>
      <div class="bo-chat__status">Bolo is thinking…</div>
      <button class="bo-chat__latest"><span class="bo-icon bo-icon--sm" aria-hidden="true">arrow_downward</span>Latest</button>
    </div>
  </div>
  <div style="position:relative;display:flex;gap:32px;justify-content:center;align-items:center">
    <div style="display:flex;align-items:center;gap:8px"><div class="bo-level" aria-hidden="true"><i style="--l:.25"></i><i style="--l:.55"></i><i style="--l:.9"></i><i style="--l:.6"></i><i style="--l:.3"></i></div><span class="micro" style="color:var(--on-scene-secondary)">Your voice</span></div>
    <div style="display:flex;align-items:center;gap:8px"><div class="bo-level bo-level--rest" aria-hidden="true"><i style="--l:.15"></i><i style="--l:.15"></i><i style="--l:.15"></i><i style="--l:.15"></i><i style="--l:.15"></i></div><span class="micro" style="color:var(--on-scene-secondary)">Resting</span></div>
  </div>
</div>
<script>document.querySelectorAll(".bo-chat").forEach(function(c){c.scrollTop=c.scrollHeight})</script>
</body>
</html>
